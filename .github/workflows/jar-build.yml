name: Java 8 JAR build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test on Java 8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read pinned AdvancedCore revision
        id: core
        shell: bash
        run: |
          ref=$(cat .github/advancedcore-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out exact AdvancedCore dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BenCodez/AdvancedCore-1.8
          ref: ${{ steps.core.outputs.ref }}
          path: .ci/AdvancedCore-1.8
          persist-credentials: false
      - name: Set up Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Show build environment
        run: |
          java -version
          mvn -version
      - name: Build and install pinned AdvancedCore
        run: mvn -B -ntp -f .ci/AdvancedCore-1.8/AdvancedCore/pom.xml -Dmaven.resolver.transport=wagon clean install
      - name: Build and verify VotingPlugin
        run: mvn -B -ntp -f VotingPlugin/pom.xml -Dmaven.resolver.transport=wagon clean verify
      - name: Upload VotingPlugin JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VotingPlugin-1.8-${{ github.sha }}
          path: VotingPlugin/target/VotingPlugin.jar
          if-no-files-found: error
          retention-days: 14
